name: Build with Maven

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Java
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'maven'
      - name: Build
        run: xvfb-run ./mvnw -B -ntp clean verify

  # This workflow runs on: branch and tag push, pull requests and manual dispatch.
  # SBOMs are only wanted for two refs: `master`, uploaded as `<version>@dev`, and
  # `v*` release tags. Feature branches and pull requests are skipped.
  sbom:
    name: Generate Maven SBOM
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/generate-sbom.yml
